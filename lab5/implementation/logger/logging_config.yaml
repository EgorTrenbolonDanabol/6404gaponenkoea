version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(message)s"
  detailed:
    format: "%(asctime)s | %(levelname)s | %(filename)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: rich.logger.RichHandler
    level: INFO
    formatter: simple
    rich_tracebacks: true
  file:
    class: logger.FileHandler
    level: DEBUG
    formatter: detailed
    filename: app.log
    mode: a
    encoding: utf-8

root:
  level: DEBUG
  handlers: [console, file]